# ESRI Wayback 卫星影像工具配置

paths:
  # 默认输出子目录名（用于 data/output/<subdir>/<coord>/<date>/）
  output_subdir: historical
  # GUI 启动时的默认坐标
  default_lat: 35.6586
  default_lon: 139.7454

processing:
  buffer_sizes: [500]
  thread_pool_size: 10
  default_zoom: 18
  max_zoom: 20
  min_zoom: 1
  tile_size: 256
  request_timeout: 30
  retry_count: 3
  download_mode: historical