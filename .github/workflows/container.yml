name: Container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（代码取自运行工作流时选择的分支，例如 v0.1.4）"
        required: true
        default: "v0.1.4"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eryieryiya/tiffgetter
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TiffGetter
            org.opencontainers.image.description=Multi-source satellite imagery downloader (CLI)
            org.opencontainers.image.licenses=MIT

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: tiffgetter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test CLI
        run: docker run --rm tiffgetter:ci --help

      - name: Smoke test runtime dependencies
        run: docker run --rm --entrypoint python tiffgetter:ci -c "import rasterio, pyproj, shapefile, PIL, numpy, requests; print('deps ok', rasterio.__version__)"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
