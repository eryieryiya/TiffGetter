name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: satellite-image-processing
          auto-activate-base: false
          miniforge-version: latest

      - name: Install build tools
        run: python -m pip install pyinstaller tkcalendar

      - name: Test and lint
        run: |
          python -m pytest
          python -m ruff check .

      - name: Build executable
        run: .\build_exe.ps1 -SkipVerify

      - name: Verify CLI entry
        run: .\dist\TiffGetter.exe --help

      - name: Prepare release files
        id: package
        run: |
          $version = "${{ github.ref_name }}"
          $exe = "dist/TiffGetter-$version.exe"
          Copy-Item "dist/TiffGetter.exe" $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TiffGetter-$version.exe" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiffGetter-${{ steps.package.outputs.version }}
          path: |
            dist/TiffGetter-*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TiffGetter ${{ github.ref_name }}
          files: |
            dist/TiffGetter-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
