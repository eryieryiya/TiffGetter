name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: satellite-image-processing
          auto-activate-base: false
          miniforge-version: latest

      # 不依赖 conda activate（在 pwsh 中可能失败），显式解析环境 Python
      - name: Resolve environment python
        id: envpy
        run: |
          $py = conda run -n satellite-image-processing python -c "import sys; print(sys.executable)" | Select-Object -Last 1
          $py = $py.Trim()
          if (-not (Test-Path $py)) { throw "未找到 conda 环境 Python: $py" }
          "path=$py" >> $env:GITHUB_OUTPUT
          Write-Host "环境 Python: $py"

      - name: Install build tools
        run: conda run --no-capture-output -n satellite-image-processing python -m pip install pyinstaller tkcalendar

      - name: Verify build dependencies
        run: |
          conda run --no-capture-output -n satellite-image-processing python -c "import sys, rasterio, PyInstaller; print(sys.version); print('rasterio', rasterio.__version__); print('PyInstaller', PyInstaller.__version__)"

      - name: Run tests
        run: conda run --no-capture-output -n satellite-image-processing python -m pytest

      - name: Run lint
        run: conda run --no-capture-output -n satellite-image-processing python -m ruff check .

      - name: Build executable
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          $code = 0
          $LASTEXITCODE = 0
          try {
            .\build_exe.ps1 -Python "${{ steps.envpy.outputs.path }}" -SkipVerify *> $log
            $code = $LASTEXITCODE
          } catch {
            $_ | Out-String | Add-Content $log
            $code = 1
          }
          Get-Content $log -Tail 40
          if ($code -ne 0) {
            $tail = (Get-Content $log -Tail 40 | Out-String)
            Add-Content $env:GITHUB_STEP_SUMMARY "### Build executable failed (exit $code)`n``````n$tail`n``````"
            exit $code
          }

      - name: Verify CLI entry
        run: .\dist\TiffGetter.exe --help

      - name: Prepare release files
        id: package
        run: |
          $version = "${{ github.ref_name }}"
          $exe = "dist/TiffGetter-$version.exe"
          Copy-Item "dist/TiffGetter.exe" $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TiffGetter-$version.exe" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiffGetter-${{ steps.package.outputs.version }}
          path: |
            dist/TiffGetter-*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TiffGetter ${{ github.ref_name }}
          files: |
            dist/TiffGetter-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
