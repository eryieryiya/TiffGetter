name: Diagnose Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: satellite-image-processing
          auto-activate-base: false
          miniforge-version: latest

      - name: Resolve environment python
        id: envpy
        run: |
          $py = conda run -n satellite-image-processing python -c "import sys; print(sys.executable)" | Select-Object -Last 1
          $py = $py.Trim()
          if (-not (Test-Path $py)) { throw "未找到 conda 环境 Python: $py" }
          "path=$py" >> $env:GITHUB_OUTPUT

      - name: Install build tools
        run: conda run --no-capture-output -n satellite-image-processing python -m pip install pyinstaller tkcalendar

      - name: Build executable
        run: |
          $ErrorActionPreference = 'Continue'
          $LASTEXITCODE = 0
          .\build_exe.ps1 -Python "${{ steps.envpy.outputs.path }}" -SkipVerify *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Write-Host "build exit: $code"
          if ($code -ne 0) { exit $code }

      - name: Report build log
        if: always()
        run: |
          if (Test-Path build.log) {
            Get-Content build.log -Tail 80
            $msg = (Get-Content build.log -Tail 12 | Out-String)
            Write-Host "::error title=Build log tail::$($msg -replace '%','%25' -replace '\r?\n','%0A')"
          } else {
            Write-Host '::error title=Build log missing::build.log was not created'
          }
