[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "data", ".trae"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# main.py 必须先执行 logging.basicConfig 再导入 satellite_processor：
# 该模块在导入时检查 root logger 是否已配置，已配置则不再自建 handler，
# 否则同一条日志会同时打到 stderr 与 stdout（GUI 日志面板重复显示）。
"main.py" = ["E402"]
